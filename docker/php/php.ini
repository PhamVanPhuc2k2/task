; ── Múi giờ ─────────────────────────────────────────
; UTC ở mọi tầng lưu trữ. Việc đổi sang Asia/Ho_Chi_Minh
; chỉ làm ở tầng trình bày. Xem README mục
; "Quy ước dữ liệu, thời gian & tiền tệ".
date.timezone = UTC

; ── Bộ nhớ & thời gian chạy ─────────────────────────
memory_limit = 512M
max_execution_time = 60

; ── Tải tệp lên ─────────────────────────────────────
; Nhân viên chụp ảnh báo cáo bằng điện thoại, mỗi ảnh 5–8MB.
; Việc nén ảnh làm ở job nền, không làm trong request.
upload_max_filesize = 20M
post_max_size = 60M
max_file_uploads = 10

; ── OPcache ─────────────────────────────────────────
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000

; validate_timestamps KHÔNG đặt ở đây — entrypoint.sh ghi nó theo biến môi
; trường OPCACHE_VALIDATE_TIMESTAMPS, để bật/tắt được mà không phải build lại
; image. Xem chú thích trong entrypoint.sh và README, mục "Vì sao backend chậm
; khi dev trên Windows".
;
; revalidate_freq = 0 nghĩa là kiểm ở MỌI request. Đã thử đặt 2 giây và đo lại:
; chỉ nhanh khi các request bắn dồn sát nhau, còn nhịp dùng thật (bấm cách nhau
; vài giây) thì vẫn chậm y hệt. Nửa vời không giải quyết được gì nên giữ 0 —
; ai cần nhanh thì tắt hẳn bằng biến môi trường.
opcache.revalidate_freq = 0

; ── Lỗi ─────────────────────────────────────────────
; Môi trường dev. Production ghi đè bằng file riêng.
display_errors = On
error_reporting = E_ALL
log_errors = On

; ── Bảo mật ─────────────────────────────────────────
expose_php = Off
