; Cấu hình PHP chỉ dùng ở production. Nạp sau 99-app.ini nên ghi đè được.

; ── OPcache ──────────────────────────────────────────
;
; Mã nguồn nằm trong image và không đổi trong suốt vòng đời container, nên việc
; kiểm dấu thời gian ở mỗi request là lãng phí thuần. Đây cũng là lý do phải
; TRIỂN KHAI BẰNG CONTAINER MỚI chứ không sửa file trong container đang chạy —
; sửa file mà không khởi động lại thì code cũ vẫn chạy, và không có gì báo.
opcache.enable=1
opcache.validate_timestamps=0
opcache.memory_consumption=256
opcache.interned_strings_buffer=32
opcache.max_accelerated_files=20000

; Nạp sẵn framework vào bộ nhớ chia sẻ ngay khi php-fpm khởi động. Bỏ trống nếu
; muốn tắt — dự án chưa sinh file preload nên để trống là đúng cho tới khi có.
; opcache.preload=/var/www/html/storage/framework/preload.php
; opcache.preload_user=www-data

; ── Ẩn thông tin ─────────────────────────────────────
;
; Header `X-Powered-By: PHP/8.4.x` nói cho người dò tìm biết chính xác phiên bản
; cần tra lỗ hổng. Không giúp gì cho ai đang dùng hệ thống.
expose_php=Off
display_errors=Off
display_startup_errors=Off

; Lỗi vào stderr để Docker gom, không ghi ra file riêng bên trong container —
; container là thứ dùng xong vứt đi, log ghi vào trong nó sẽ mất theo.
log_errors=On
error_log=/dev/stderr

; ── Giới hạn ─────────────────────────────────────────
;
; 10 MB mỗi tệp đính kèm (luật nghiệp vụ), 5 tệp một lượt, cộng phần dư cho
; phần bao gói của multipart.
upload_max_filesize=10M
post_max_size=60M
max_file_uploads=10

; Request nào chạy quá 30 giây ở đây là hỏng, không phải chậm. Việc dài phải
; nằm ở hàng đợi.
max_execution_time=30
memory_limit=256M

; ── Phiên ────────────────────────────────────────────
session.cookie_httponly=1
session.cookie_secure=1
session.cookie_samesite=Lax
session.use_strict_mode=1
