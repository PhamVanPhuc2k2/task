; Supervisor giữ queue worker sống.
;
; ── Vì sao cần, khi Docker đã có `restart: unless-stopped` ───────────────────
;
; Docker chỉ khởi động lại khi **tiến trình chính chết**. Horizon có thể còn
; sống mà đã ngừng làm việc: một worker con bị OOM-kill, một kết nối Redis chết
; và không tự nối lại. Lúc đó container vẫn "đang chạy", healthcheck vẫn xanh,
; và hàng đợi dồn lại trong im lặng.
;
; Supervisor theo dõi từng tiến trình con và dựng lại đúng cái chết.
;
; ── Vì sao KHÔNG chạy Horizon chung container với php-fpm ────────────────────
;
; Hai thứ này có nhịp sống khác nhau. Deploy phiên bản mới cần php-fpm đổi ngay
; nhưng worker phải xử lý nốt job đang chạy rồi mới dừng. Gộp chung thì mỗi lần
; deploy là một lần cắt ngang job đang chạy dở.
;
; File này dùng cho container `worker`, không dùng cho container `app`.

[supervisord]
nodaemon=true
user=www-data
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:horizon]
process_name=%(program_name)s
command=php /var/www/html/artisan horizon
user=www-data
autostart=true
autorestart=true
; Horizon tự dừng êm khi nhận TERM: nó chờ job đang chạy xong rồi mới thoát.
; 3600 giây là trần chờ — dài hơn job dài nhất của hệ thống (nén ảnh, gửi thư
; hàng loạt), để không bao giờ cắt ngang một job đang chạy dở.
stopwaitsecs=3600
stopsignal=TERM
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:scheduler]
process_name=%(program_name)s
command=php /var/www/html/artisan schedule:work
user=www-data
autostart=true
autorestart=true
; Scheduler chỉ ngồi đếm giờ, dừng lúc nào cũng được.
stopwaitsecs=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
