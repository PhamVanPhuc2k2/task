server {
    listen 80;
    server_name _;
    root /var/www/html/public;

    index index.php;
    charset utf-8;

    client_max_body_size 60M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ── Header bảo mật cho TỆP TĨNH ──────────────────
    #
    # Ứng dụng tự gắn header cho mọi phản hồi nó sinh ra (xem middleware
    # SecurityHeaders). Ở đây chỉ lo những tệp Nginx phục vụ thẳng, không đi
    # qua PHP — chủ yếu là tệp đính kèm dưới /storage.
    #
    # Cố tình KHÔNG khai ở mức server: `add_header` của Nginx *thêm vào* chứ
    # không ghi đè header từ upstream, nên khai cả hai chỗ sẽ ra hai dòng
    # header trùng nhau — và với Referrer-Policy hai giá trị khác nhau thì
    # trình duyệt lấy giá trị cuối, tức cấu hình nào thắng là chuyện may rủi.
    # ── Logo công ty: NGOẠI LỆ có chủ ý ──────────────
    #
    # Khối `/storage/` bên dưới gắn `Content-Disposition: attachment` cho mọi
    # tệp — đúng, vì tệp người dùng tải lên không được phép hiện inline trên
    # tên miền của mình.
    #
    # Logo thì khác, và phải khác: nó là tài sản thương hiệu, chỉ quản trị viên
    # và giám đốc tải lên được, và nó BẮT BUỘC hiện trong thẻ <img> ở đầu trang
    # lẫn trang đăng nhập. Ép tải xuống thì tính năng đổi logo vô dụng.
    #
    # Vẫn giữ `nosniff`: backend chỉ nhận PNG/JPG/WebP (không nhận SVG vì SVG
    # chạy được mã), nhưng lớp thứ hai ở đây không tốn gì.
    location /storage/branding/ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;

        # Đổi logo thì tên tệp đổi theo, nên cache dài được mà không sợ cũ.
        add_header Cache-Control "public, max-age=86400" always;

        try_files $uri =404;
    }

    location /storage/ {
        # Quan trọng nhất trong ba dòng: không có nosniff thì một tệp đính kèm
        # text/plain chứa HTML có thể bị trình duyệt hiểu thành HTML và chạy
        # script trong ngữ cảnh tên miền của mình.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;

        # Tệp đính kèm luôn tải xuống, không mở trong tab. Chặn đường biến một
        # tệp người dùng tải lên thành trang chạy được trên tên miền của mình.
        add_header Content-Disposition "attachment" always;

        try_files $uri =404;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        include fastcgi_params;

        fastcgi_read_timeout 60;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    # Chặn truy cập file ẩn, trừ .well-known
    location ~ /\.(?!well-known).* {
        deny all;
    }

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;
}
