# Cửa duy nhất của hệ thống trên production.
#
# ## Vì sao gộp một origin thay vì tách hai tên miền
#
# Xác thực dùng **cookie phiên của Sanctum**, không dùng token. Tách frontend và
# API ra hai origin thì phải cấu hình CORS, cookie `SameSite=None`, và một danh
# sách `SANCTUM_STATEFUL_DOMAINS` phải khớp tuyệt đối — ba chỗ, và sai chỗ nào
# cũng ra cùng một triệu chứng khó hiểu: đăng nhập xong bị đá về trang đăng nhập.
#
# Cùng một origin thì cả ba vấn đề đó biến mất. Trình duyệt chỉ thấy một tên
# miền; nginx quyết định phía sau là PHP hay Node.
#
# ## Thứ tự các khối location là quan trọng
#
# nginx chọn khối có tiền tố DÀI NHẤT khớp, nên `/storage/branding/` thắng
# `/storage/`, và `/api/` thắng `/`. Không phụ thuộc thứ tự viết trong file,
# nhưng vẫn xếp từ hẹp tới rộng cho người đọc dễ theo.

upstream php_backend {
    server app:9000;
}

upstream next_frontend {
    server frontend:3000;
}

server {
    listen 80;
    server_name _;

    # KHÔNG khai `root` trỏ vào thư mục của Laravel.
    #
    # nginx ở production không có mã PHP: nó chỉ chuyển tiếp sang php-fpm, mà
    # php-fpm tự phân giải đường dẫn trong container của NÓ. Cho nginx mount
    # `public/` qua volume dùng chung nghe thì tiện, nhưng volume có tên chỉ
    # được nạp từ image ĐÚNG MỘT LẦN lúc còn rỗng — deploy lần thứ hai mà
    # `public/index.php` đổi thì volume vẫn giữ bản cũ, im lặng.
    #
    # Bỏ hẳn phụ thuộc đó thì lỗi kia không tồn tại.
    charset utf-8;

    # 60M: đủ cho ảnh báo cáo chụp màn hình. Phải khớp với `upload_max_filesize`
    # của PHP — nginx chặn trước thì người dùng nhận 413 trần trụi thay vì câu
    # lỗi tiếng Việt của ứng dụng.
    client_max_body_size 60M;

    # Không lộ phiên bản nginx trong header và trang lỗi.
    server_tokens off;

    # ── Logo công ty: NGOẠI LỆ có chủ ý ──────────────
    #
    # Khối `/storage/` bên dưới ép tải xuống mọi tệp — đúng, vì tệp người dùng
    # tải lên không được hiện inline trên tên miền của mình. Logo thì phải hiện
    # inline: nó là tài sản thương hiệu, chỉ quản trị viên và giám đốc tải lên
    # được, và nó nằm trong thẻ <img> ở đầu trang lẫn trang đăng nhập.
    location /storage/branding/ {
        # `alias` chứ không `root`: tệp thật nằm ở `storage/app/public/branding`,
        # còn địa chỉ web là `/storage/branding`. Không đi qua symlink
        # `public/storage` — một mắt xích nữa để hỏng mà không được gì.
        alias /var/www/html/storage/app/public/branding/;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Cache-Control "public, max-age=86400" always;

        try_files $uri =404;
    }

    # ── Tệp đính kèm ────────────────────────────────
    #
    # Ứng dụng tự gắn header cho mọi phản hồi nó sinh ra (middleware
    # SecurityHeaders). Ở đây chỉ lo những tệp nginx phục vụ thẳng.
    #
    # Cố tình KHÔNG khai ở mức server: `add_header` của nginx *thêm vào* chứ
    # không ghi đè header từ upstream, nên khai cả hai chỗ sẽ ra header trùng —
    # và với Referrer-Policy hai giá trị khác nhau thì trình duyệt lấy giá trị
    # cuối, tức cấu hình nào thắng là chuyện may rủi.
    location /storage/ {
        # Quan trọng nhất: không có nosniff thì một tệp text/plain chứa HTML có
        # thể bị trình duyệt hiểu thành HTML và chạy script trong ngữ cảnh tên
        # miền của mình.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Disposition "attachment" always;

        alias /var/www/html/storage/app/public/;

        try_files $uri =404;
    }

    # ── API, và các đường của Laravel ───────────────
    #
    # Chuyển thẳng sang php-fpm với đường dẫn script CỐ ĐỊNH, không qua
    # `try_files`. `try_files` bắt nginx phải nhìn thấy tệp trên đĩa của chính
    # nó — mà ở đây nó không có mã PHP nào cả.
    location ~ ^/(api|sanctum|horizon|up)(/|$) {
        fastcgi_pass php_backend;

        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        include fastcgi_params;

        # Báo cho Laravel biết kết nối gốc là HTTPS. Không có dòng này thì mọi
        # đường dẫn ứng dụng tự sinh ra (liên kết đặt lại mật khẩu chẳng hạn)
        # sẽ mang tiền tố `http://` — và trình duyệt chặn.
        fastcgi_param HTTPS $http_x_forwarded_proto;

        fastcgi_read_timeout 60;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    # ── Tệp tĩnh của Next.js ────────────────────────
    #
    # Tên tệp có mã băm nội dung nên đổi mã là đổi tên, và Next **đã tự đặt**
    # `Cache-Control: public, max-age=31536000, immutable`.
    #
    # Cố ý KHÔNG thêm `add_header` ở đây. `add_header` của nginx *thêm vào* chứ
    # không ghi đè header từ upstream — đo thật thì thấy Cache-Control ra hai
    # dòng. Lần này hai dòng trùng giá trị nên vô hại, nhưng ngày Next đổi chính
    # sách cache thì hai dòng sẽ khác nhau, và cái nào thắng là chuyện may rủi.
    # Cùng lý do đã ghi ở khối /storage/ bên trên.
    location /_next/static/ {
        proxy_pass http://next_frontend;
        proxy_http_version 1.1;
    }

    # ── Còn lại: giao diện ──────────────────────────
    location / {
        proxy_pass http://next_frontend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        # Bắt buộc cho hot reload và mọi kết nối nâng cấp giao thức về sau.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 60;
    }

    # Chặn truy cập file ẩn, trừ .well-known (Let's Encrypt cần nó).
    location ~ /\.(?!well-known).* {
        deny all;
    }

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;
}
