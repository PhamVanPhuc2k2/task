name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # KHÔNG huỷ giữa chừng trên main.
  #
  # Trên nhánh khác thì huỷ lần chạy cũ là đúng: chỉ mất mấy phút chạy test.
  # Trên main thì lần chạy đó có thể đang deploy — đẩy tiếp một commit nữa sẽ
  # giết nó vào giữa bước đổi container hoặc giữa migration, và hệ thống dừng ở
  # một trạng thái không ai mô tả được.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # ── Backend: Laravel ───────────────────────────────
  backend:
    name: Backend (PHP 8.4)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: task_management_test
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      # PHP 8.4 là bắt buộc: spatie/laravel-model-states,
      # spatie/laravel-activitylog và pest v5 đều yêu cầu ^8.4.
      - name: Cài PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pdo_mysql, bcmath, intl, zip, gd, exif, pcntl, redis
          coverage: none
          tools: composer:v2

      - name: Lấy cache Composer
        uses: actions/cache@v4
        with:
          path: backend/vendor
          key: composer-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-

      - name: Cài dependency
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Chuẩn bị môi trường
        run: |
          cp .env.example .env
          php artisan key:generate

      # ── Các cổng chặn merge ──────────────────────────
      - name: Định dạng code (Pint)
        run: ./vendor/bin/pint --test

      - name: Phân tích tĩnh (Larastan mức 8)
        run: ./vendor/bin/phpstan analyse --memory-limit=1G --no-progress

      # Không dùng --fail-on-uncovered: mọi phụ thuộc vào Illuminate/Carbon đều
      # tính là "uncovered" vì vendor không nằm trong layer nào. Cái cần chặn là
      # "Violations" — vi phạm ranh giới giữa các tầng và các miền.
      - name: Ranh giới kiến trúc (Deptrac)
        run: ./vendor/bin/deptrac analyse --no-progress

      # Chỉ khai những gì phụ thuộc vào MÁY chạy test (địa chỉ database, Redis).
      #
      # Mọi lựa chọn khác thuộc về phpunit.xml, và CI không được lấn sang. Biến
      # môi trường của tiến trình LUÔN thắng thẻ <env> của PHPUnit (force mặc
      # định là false — PHPUnit không ghi đè biến đã có), nên mỗi dòng thừa ở
      # đây là một dòng lặng lẽ đổi cấu hình test.
      #
      # Bản trước có thêm CACHE_STORE=redis và QUEUE_CONNECTION=redis. Đo bằng
      # cách bật lại từng cái:
      #
      #   CACHE_STORE=redis       → 358 test đỏ
      #   QUEUE_CONNECTION=redis  →  10 test đỏ
      #
      # Cache dùng chung là nặng nhất, và lý do rất khó đoán từ thông báo lỗi:
      # bộ đếm giới hạn tần suất nằm trong cache. Với `array` thì mỗi test có
      # cache riêng và bộ đếm về 0; với `redis` thì bộ đếm **sống xuyên qua mọi
      # test và mọi tiến trình song song**, nên test thứ n bị chặn 429 trong khi
      # nó đang kiểm 403. Thông báo là "Expected 403 but received 429" — không
      # có chữ nào nhắc tới cache.
      - name: Kiểm thử (Pest, gồm cả architecture test)
        run: ./vendor/bin/pest --parallel
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: task_management_test
          DB_USERNAME: root
          DB_PASSWORD: root
          REDIS_HOST: 127.0.0.1

      # Tách "CÓ lỗ hổng" khỏi "KHÔNG kiểm được".
      #
      # `composer audit` thoát khác 0 cho CẢ HAI trường hợp, nên bản trước
      # không phân biệt được. Một lần Packagist trục trặc là cả đường ống đỏ,
      # `build-push` bị bỏ qua, và không deploy được — vì một lý do chẳng liên
      # quan gì tới mã nguồn vừa đẩy lên.
      #
      #   Có khuyến cáo    → CHẶN. Đó đúng là việc của bước này.
      #   Không kiểm được  → cảnh báo to rồi đi tiếp. Một API không với tới
      #                      được thì không nói được gì về mã nguồn, mà chặn
      #                      deploy hàng giờ vì sự cố của người khác là cách
      #                      dạy người ta quen bỏ qua CI.
      #
      # `::warning::` hiện ngay đầu trang tóm tắt của lần chạy, không phải một
      # dòng chìm giữa log — nên "đi tiếp" ở đây không đồng nghĩa với im lặng.
      - name: Rà soát lỗ hổng phụ thuộc
        run: |
          set +e
          composer audit --no-interaction --format=json \
            > "$RUNNER_TEMP/audit.json" 2> "$RUNNER_TEMP/audit.err"
          set -e

          if jq -e . "$RUNNER_TEMP/audit.json" >/dev/null 2>&1; then
              SO=$(jq '.advisories | length' "$RUNNER_TEMP/audit.json")

              if [ "$SO" -gt 0 ]; then
                  echo "::error::Có ${SO} khuyến cáo bảo mật trong phụ thuộc PHP."
                  jq '.advisories' "$RUNNER_TEMP/audit.json"
                  exit 1
              fi

              echo "✔ Không có khuyến cáo nào."
              exit 0
          fi

          echo "::warning::KHÔNG kiểm được lỗ hổng phụ thuộc PHP — composer audit không trả về JSON hợp lệ. Đây là sự cố công cụ, không phải kết luận là sạch."
          echo "── stderr ──"
          cat "$RUNNER_TEMP/audit.err" || true
          echo "── stdout ──"
          head -c 2000 "$RUNNER_TEMP/audit.json" || true

  # ── Frontend: Next.js ──────────────────────────────
  frontend:
    name: Frontend (Node 24)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Cài Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Cài dependency
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Prettier
        run: npm run format:check

      - name: Kiểm tra kiểu (tsc)
        run: npm run typecheck

      - name: Build
        run: npm run build

      # Cùng lý do với bước tương ứng ở job backend: `npm audit` cũng thoát
      # khác 0 cho cả "có lỗ hổng" lẫn "không gọi được registry".
      - name: Rà soát lỗ hổng phụ thuộc
        run: |
          set +e
          npm audit --json \
            > "$RUNNER_TEMP/npm-audit.json" 2> "$RUNNER_TEMP/npm-audit.err"
          set -e

          if jq -e '.metadata.vulnerabilities' "$RUNNER_TEMP/npm-audit.json" >/dev/null 2>&1; then
              SO=$(jq '.metadata.vulnerabilities.high + .metadata.vulnerabilities.critical' \
                    "$RUNNER_TEMP/npm-audit.json")

              if [ "$SO" -gt 0 ]; then
                  echo "::error::Có ${SO} lỗ hổng mức high/critical trong phụ thuộc Node."
                  npm audit --audit-level=high || true
                  exit 1
              fi

              echo "✔ Không có lỗ hổng high/critical."
              exit 0
          fi

          echo "::warning::KHÔNG kiểm được lỗ hổng phụ thuộc Node — npm audit không trả về JSON hợp lệ. Đây là sự cố công cụ, không phải kết luận là sạch."
          echo "── stderr ──"
          cat "$RUNNER_TEMP/npm-audit.err" || true

  # ── Build image và đẩy lên GHCR ────────────────────
  #
  # Chỉ chạy khi ĐÃ qua hết cổng chặn ở trên, và chỉ trên main.
  #
  # Vì sao build ở đây chứ không trên máy chủ: xem đầu scripts/deploy.sh. Tóm
  # tắt là máy chủ chỉ còn ~2,2GB RAM khả dụng trong khi `next build` cần ~2GB,
  # và quan trọng hơn — image build trên máy chủ không phải thứ vừa chạy test.
  build-push:
    name: Build image → GHCR
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      # GHCR chỉ nhận tên viết thường, mà tài khoản GitHub thì có chữ hoa.
      - name: Tên repo viết thường
        id: ten
        run: echo "repo=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Gắn tag bằng SHA ĐẦY ĐỦ chứ không phải bản rút gọn.
      #
      # SHA rút gọn 7 ký tự sẽ đụng nhau khi repo lớn dần, và lúc đụng thì
      # `docker pull` lấy về một image khác hẳn mà không báo gì. Tag `latest`
      # thêm vào chỉ để người ta gõ tay cho nhanh — deploy KHÔNG bao giờ dùng
      # nó, vì `latest` không nói được đang chạy mã nào.
      - name: Build app (PHP)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/php/Dockerfile.prod
          push: true
          tags: |
            ghcr.io/${{ steps.ten.outputs.repo }}/app:${{ github.sha }}
            ghcr.io/${{ steps.ten.outputs.repo }}/app:latest
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app

      # Không truyền NEXT_PUBLIC_API_URL: mặc định trong Dockerfile là đường dẫn
      # TƯƠNG ĐỐI (`/api/v1`), nên một image chạy được ở mọi tên miền.
      - name: Build frontend (Next.js)
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: docker/node/Dockerfile.prod
          push: true
          tags: |
            ghcr.io/${{ steps.ten.outputs.repo }}/frontend:${{ github.sha }}
            ghcr.io/${{ steps.ten.outputs.repo }}/frontend:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  # ── Triển khai lên máy chủ ─────────────────────────
  deploy:
    name: Triển khai lên máy chủ
    needs: build-push
    runs-on: ubuntu-latest

    # Đặt tên môi trường để sau này bật "cần người duyệt" được ngay trong giao
    # diện GitHub, không phải sửa file này.
    environment:
      name: production
      url: https://extask.us

    # Hàng đợi riêng cho deploy, và KHÔNG huỷ lần đang chạy: hai lần deploy
    # chồng nhau là hai lần `migrate` chồng nhau.
    concurrency:
      group: deploy-production
      cancel-in-progress: false

    permissions:
      contents: read
      packages: read

    steps:
      # Thiếu secret thì hỏng ở đây, với câu nói rõ thiếu cái gì.
      #
      # Không "bỏ qua êm" khi thiếu cấu hình: một job màu xanh vì nó không làm
      # gì cả là thứ nguy hiểm nhất trong toàn bộ đường ống này — nó dạy người
      # đọc rằng dấu tích nghĩa là đã deploy.
      - name: Kiểm secret
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST_KEY: ${{ secrets.VPS_HOST_KEY }}
        run: |
          THIEU=""
          for TEN in VPS_HOST VPS_USER VPS_SSH_KEY VPS_HOST_KEY; do
              [ -z "${!TEN:-}" ] && THIEU="${THIEU} ${TEN}"
          done
          if [ -n "$THIEU" ]; then
              echo "✘ Thiếu secret:${THIEU}" >&2
              echo "  Thêm ở: Settings → Secrets and variables → Actions" >&2
              echo "  Xem README, mục 'Đường ống CI/CD'." >&2
              exit 1
          fi
          echo "✔ Đủ 4 secret."

      - name: Chuẩn bị SSH
        env:
          KHOA: ${{ secrets.VPS_SSH_KEY }}
          HOST_KEY: ${{ secrets.VPS_HOST_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh

          # `tr -d '\r'` không phải để cho chắc.
          #
          # Khoá riêng nằm trong một tệp trên máy Windows. Mở bằng Notepad hay
          # nhiều trình soạn thảo rồi bôi đen chép đi là mang theo ký tự CR ở
          # cuối MỖI dòng. GitHub cất nguyên văn, và OpenSSH từ chối cả khoá vì
          # đúng những ký tự vô hình đó.
          #
          # Điều làm nó khó truy: thông báo lỗi là "error in libcrypto" hoặc
          # "invalid format" — không có chữ nào nhắc tới ký tự xuống dòng, và
          # nhìn secret trên giao diện GitHub thì không thấy gì bất thường vì
          # giá trị bị che.
          printf '%s\n' "$KHOA" | tr -d '\r' > ~/.ssh/id_ci
          chmod 600 ~/.ssh/id_ci

          # Ghim host key thay vì chấp nhận bừa lần đầu. Không có dòng này thì
          # mỗi lần chạy là một lần tin người lạ, và một kẻ đứng giữa chỉ cần
          # đúng một lần chạy để nhận được token GHCR.
          printf '%s\n' "$HOST_KEY" | tr -d '\r' > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          # Hỏng thì hỏng NGAY ĐÂY, kèm câu nói rõ phải sửa gì.
          #
          # Không có bước này, một khoá sai làm `ssh` ở bước sau thất bại với
          # một dòng lỗi chung chung, và người đọc log không phân biệt được
          # "khoá hỏng" với "máy chủ từ chối" hay "mạng không thông".
          #
          # Vân tay in ra để đối chiếu với khoá đã cài trên máy chủ:
          #   ssh-keygen -lf ~/.ssh/explus-ci-deploy.pub
          echo "── Vân tay khoá CI đọc được từ secret ──"
          if ! ssh-keygen -lf ~/.ssh/id_ci; then
              echo "::error::VPS_SSH_KEY không đọc được. Kiểm: đã dán ĐỦ cả dòng BEGIN và END chưa, và tệp có phải OpenSSH format không."
              exit 1
          fi

          echo "── Host key đã ghim ──"
          ssh-keygen -lf ~/.ssh/known_hosts || {
              echo "::error::VPS_HOST_KEY không đọc được. Lấy lại bằng: ssh-keyscan -t ed25519 <ip>"
              exit 1
          }

      - name: Chạy deploy trên máy chủ
        env:
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          # Đưa qua biến môi trường chứ không nội suy thẳng vào dòng lệnh:
          # `${{ }}` được thay TRƯỚC khi shell chạy, nên giá trị nào chứa ký tự
          # shell hiểu được sẽ thành một phần của câu lệnh. Ở đây giá trị là an
          # toàn, nhưng thói quen nội suy thẳng thì không.
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Token đi qua stdin, không qua tham số dòng lệnh: tham số hiện trong
          # `ps` cho mọi tiến trình trên máy chủ đọc được.
          #
          # Khoá này bị trói vào scripts/ci-deploy.sh bằng `command=` trong
          # authorized_keys, nên chuỗi dưới đây chỉ là dữ liệu cho script đó
          # đọc — không mở được shell.
          printf '%s\n' "$GHCR_TOKEN" \
            | ssh -i ~/.ssh/id_ci \
                  -o BatchMode=yes \
                  -o StrictHostKeyChecking=yes \
                  "${VPS_USER}@${VPS_HOST}" \
                  "deploy ${GITHUB_SHA}"

      - name: Kiểm bằng con mắt người dùng
        run: |
          # Bước cuối, và là bước duy nhất nhìn hệ thống TỪ BÊN NGOÀI.
          #
          # deploy.sh đã có health check, nhưng nó chạy từ trong máy chủ nên
          # không thấy được Cloudflare, nginx của máy chủ, hay chứng chỉ. Cả ba
          # đều từng hỏng riêng trong khi container vẫn xanh.
          for i in $(seq 1 10); do
              MA=$(curl -s -o /dev/null -w '%{http_code}' https://extask.us/login || echo 000)
              if [ "$MA" = "200" ]; then
                  echo "✔ https://extask.us/login trả về 200"
                  exit 0
              fi
              echo "   lần $i: HTTP $MA, chờ 6 giây..."
              sleep 6
          done
          echo "✘ Trang đăng nhập KHÔNG phục vụ được từ internet." >&2
          echo "  Container có thể vẫn xanh — kiểm nginx máy chủ và Cloudflare." >&2
          exit 1
